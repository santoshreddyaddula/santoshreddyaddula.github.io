<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Santosh Reddy Addula - Academic Portfolio</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
/* ===== Global Styles ===== */
body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    background-color: #000000;
    color: #000000;
}

/* ===== Sidebar ===== */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 260px;
    height: 100%;
    background-color: #000000;
    padding: 30px 20px;
    box-sizing: border-box;
    overflow-y: auto;
    color: #ffffff;
}

.profile-section {
    text-align: center;
    margin-bottom: 30px;
}

.profile-photo-placeholder {
    width: 120px;
    height: 120px;
    background-color: #333333;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px auto;
    font-size: 50px;
    color: #00aaff;
}

.profile-section h1 {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 5px;
    color: #ffffff;
}

.profile-section p {
    margin: 3px 0;
    font-size: 0.95rem;
    color: #cccccc;
}

/* ===== Contact Info ===== */
.contact-info {
    margin-top: 10px;
}

.contact-info a {
    display: inline-block;
    font-size: 1.3rem;
    color: #00aaff;
    margin: 5px 8px;
    transition: 0.3s ease;
}

.contact-info a:hover {
    color: #00ffff;
}

.contact-info .location {
    display: block;
    font-size: 0.85rem;
    color: #bbbbbb;
    margin-top: 5px;
}

/* ===== Social Links ===== */
.social-links a {
    margin: 0 5px;
    color: #00aaff;
    font-size: 1.2rem;
}

.social-links a:hover {
    color: #00ffff;
}

/* ===== Sidebar Navigation ===== */
.main-nav ul {
    list-style: none;
    padding: 0;
    margin-top: 20px;
}

.main-nav ul li {
    margin-bottom: 10px;
}

.main-nav ul li a {
    color: #ffffff;
    text-decoration: none;
    font-weight: 500;
    display: block;
    padding: 8px 10px;
    border-radius: 5px;
    transition: all 0.3s ease;
}

.main-nav ul li a:hover,
.main-nav ul li a.active {
    background-color: #00aaff;
    color: #ffffff;
}

/* ===== Main Content ===== */
.content {
    margin-left: 280px;
    padding: 40px 30px;
    background-color: #ffffff;
    color: #000000;
    min-height: 100vh;
    box-sizing: border-box;
}

.section {
    padding: 25px 20px;
    margin-bottom: 30px;
}

.section h2 {
    text-align: center;
    color: #00aaff;
    margin-bottom: 20px;
    font-size: 1.5rem;
}

.section p {
    margin-bottom: 15px;
    text-align: justify;
    font-size: 1rem;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }
    .content {
        margin-left: 0;
        padding: 20px 15px;
    }
}
</style>
</head>
<body>

<div class="sidebar">
    <div class="profile-section">
        <div class="profile-photo-placeholder">
            <i class="fas fa-user-graduate"></i>
        </div>
        <h1>Dr. Santosh Reddy Addula</h1>
        <p>Research Scholar</p>
        <p>University of the Cumberlands</p>

        <!-- UPDATED CONTACT INFO -->
        <div class="contact-info">
            <!-- Email Icon Only -->
            <a href="mailto:santoshaddulait@gmail.com" title="Send Email">
                <i class="fas fa-envelope"></i>
            </a>

            <!-- Location -->
            <span class="location">
                <i class="fas fa-map-marker-alt"></i> USA
            </span>
        </div>

        <div class="social-links">
            <a href="#" target="_blank" title="Google Scholar"><i class="fas fa-graduation-cap"></i></a>
            <a href="#" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
            <a href="#" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
        </div>
    </div>

    <nav class="main-nav">
        <ul>
            <li><a href="#about" class="active">Biography</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#publication">Publications</a></li>
            <li><a href="#services">Professional Activities</a></li>
        </ul>
    </nav>
</div>

<div class="content">
    <section id="about" class="section">
        <h2>Biography</h2>
        <p>Biography content here...</p>
    </section>
</div>

</body>
</html>
