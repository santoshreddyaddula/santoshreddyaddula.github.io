<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Santosh Reddy Addula - Academic Portfolio</title>

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- Embedded CSS for simplicity -->
<style>
/* ===== Body & Global Styles ===== */
body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background-color: #2a2a4d; /* Main background */
    color: #e0e0e0; /* Light gray text */
}

/* Container for sidebar + main content */
.container {
    display: flex;
    min-height: 100vh;
}

/* ===== Sidebar ===== */
.sidebar {
    width: 280px;
    background-color: #1e1e3f; /* Deep navy */
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.profile-section h1 {
    font-size: 1.8rem;
    margin: 10px 0 5px;
    text-align: center;
}

.profile-section .title,
.profile-section .affiliation {
    font-size: 0.9rem;
    text-align: center;
    margin: 2px 0;
}

.profile-photo-placeholder {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background-color: #3b3b70;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    color: #00aaff;
}

.contact-info p {
    font-size: 0.85rem;
    margin: 5px 0;
}

.social-links a {
    color: #00aaff;
    margin: 5px;
    font-size: 1.2rem;
    transition: color 0.3s;
}

.social-links a:hover {
    color: #00ffff;
}

/* Sidebar navigation */
.main-nav ul {
    list-style: none;
    padding: 0;
    width: 100%;
    margin-top: 30px;
}

.main-nav ul li {
    margin-bottom: 15px;
}

.main-nav ul li a {
    color: #e0e0e0;
    text-decoration: none;
    font-weight: 500;
    display: block;
    padding: 8px 12px;
    border-radius: 5px;
    transition: background 0.3s;
}

.main-nav ul li a.active,
.main-nav ul li a:hover {
    background-color: #00aaff;
    color: #1e1e3f;
}

/* ===== Main Content ===== */
.content {
    flex: 1;
    padding: 40px;
}

.section {
    background-color: #35356a; /* Slightly lighter than main bg */
    padding: 30px;
    margin-bottom: 30px;
    border-radius: 10px;
}

.section h2 {
    color: #00aaff;
    margin-bottom: 15px;
}

.section-content p {
    line-height: 1.6;
    margin-bottom: 15px;
}

/* Publication list */
.publication-list {
    list-style: none;
    padding: 0;
}

.publication-item {
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid #444477;
}

.publication-item .paper-title {
    font-weight: 500;
    color: #ffffff;
}

.publication-item .paper-venue {
    font-size: 0.9rem;
    color: #cccccc;
}

.publication-item .paper-links a {
    color: #00aaff;
    margin-right: 10px;
}

.publication-item .paper-links a:hover {
    color: #00ffff;
}

/* Footer */
.footer {
    text-align: center;
    padding: 20px;
    font-size: 0.85rem;
    color: #aaaaaa;
}
.footer a {
    color: #00aaff;
    text-decoration: none;
}
.footer a:hover {
    color: #00ffff;
}
</style>
</head>
